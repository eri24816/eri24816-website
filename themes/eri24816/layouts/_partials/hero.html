
<div class="hero">
    <div class="hero-left">
        <div class="hero-left-top">
            <div class="profile-photo">
                <img src="{{ .Site.Params.profile_photo }}" alt="Profile photo">
            </div>



        </div>

    </div>
    <div class="hero-right">
        <div class="hero-name-and-contact">
            <h2 class="hero-name">{{ .Site.Params.name }}</h2>
            <div class="contact">
                <a href="mailto:{{ .Site.Params.email }}"><i class="fas fa-envelope"></i></a>
                <a href="{{ .Site.Params.github }}"><i class="fab fa-github"></i></a>
                <a href="{{ .Site.Params.instagram }}"><i class="fab fa-instagram"></i></a>
                <a href="{{ .Site.Params.linkedin }}"><i class="fab fa-linkedin"></i></a>
            </div>
        </div>
        <h3 class="hero-subtitle">{{ .Site.Params.subtitle }}</h3>
        
        <p class="intro">
            {{ .Site.Params.intro }}
        </p>

        <div class="embed fade">
            {{ .Site.Params.embed | safeHTML }}
        </div>
    </div>
</div>
<style>
    .hero {
        width: 100%;
        max-width: 1200px;
        padding: 2rem;
        display: flex;
        gap: 3rem;
        align-items: flex-start;
        justify-content: center;
        margin-left: auto;
        margin-right: auto;
        flex-wrap: wrap;
    }


    .hero-left {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
    }

    .hero-right {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        max-width: 800px;
        min-width: 200px;
        gap: 1rem;
    }



    .profile-photo {
        width: 180px;
        height: 180px;
        overflow: hidden;
        border-radius: 50%;
    }

    .profile-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .name {
        margin: 0;
        font-size: 2.5rem;
        color: var(--text-color);
    }

    .contact {
        display: flex;
        flex-direction: row;
        gap: 0.5rem;
        align-items: center;
    }

    .contact a {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 2rem;
    }

    .intro {
        margin: 0;
        line-height: 1.6;
        font-size: 24px;
    }

    .intro p, ul {
        margin: 0;
    }

    .intro h2 {
        margin-top: 1rem;
        margin-bottom: 0;
        font-size: 1.5rem;
        font-weight: 600;
    }
    .intro a {
        font-weight: 600;
    }

    .embed {
        margin: 0 auto;
        width: 100%;
        max-width: 600px;
    }

    .hero-name {
        font-weight: 600;
        margin-bottom: 0;
        margin-top: 0;
        font-size: 2.5rem;
    }

    .hero-subtitle {
        margin-top: 0;
        font-size: 1.5rem;
        color: var(--text-color-muted);
    }

    .hero-name-and-contact {
        margin-top: 10px;
        display: flex;
        flex-direction: row;
        gap: 2rem;
        align-items: center;
    }

    .highlights {
        margin: 2rem 0;
        height: 350px;
    }

    .highlights .card{
        min-width: 100%;
        width: 100%;
        height: 300px;
    }

    .hero-cards-container-inner::-webkit-scrollbar {
        display: none;
    }

    .hero-scroll-container {
        display: flex;
        align-items: center;
        overflow-x: auto;
        scroll-behavior: smooth;
    }

    .hero-cards-container {
        position: relative;
        display: flex;
        scroll-behavior: smooth;
        gap: 2rem;
        padding: 1rem;
        width: 100%;
        padding: 0 1rem;
    }

    .hero-cards-container::-webkit-scrollbar {
        display: none;
    }



    .highlights{
        width: 500px;
    }

    .highlights-title {
        margin-top: 0;
        margin-left: 3rem;
    }

    @media (max-width: 768px) {
        .contact a{
            font-size: 1.5rem;
        }


</style>

<script>
    function scrollHighlights(btn, amount) {
        const container = btn.parentElement.querySelector('.hero-cards-container');
        container.scrollLeft += amount * container.clientWidth + 5;
    }
</script>
